{% extends 'base.html' %}

{% block title %}Recuperação de Senha | CodeView{% endblock %}

{% block content %}
<div class="flex-1 flex items-center justify-center px-4 py-12 sm:px-6 lg:px-8">
    <div class="w-full max-w-md space-y-8 bg-[#111827]/90 border border-gray-800 rounded-2xl p-8 shadow-2xl backdrop-blur-sm">
        <div class="text-center">
            <h2 class="text-2xl font-bold tracking-tight text-white">Recuperar Senha</h2>
            <p class="mt-2 text-sm text-gray-400">
                Informe o seu e-mail cadastrado para enviarmos as instruções de redefinição.
            </p>
        </div>

        <form class="mt-6 space-y-5" method="POST" novalidate>
            {% csrf_token %}
            <div>
                <label for="id_email" class="block text-xs font-semibold uppercase tracking-wider text-gray-300 mb-1.5">
                    Seu E-mail
                </label>
                <input type="email" name="email" id="id_email" required 
                       class="w-full px-4 py-2 bg-gray-800 border border-gray-700 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" 
                       placeholder="seu.email@exemplo.com">
            </div>

            <div>
                <button type="submit" class="w-full py-3 px-4 rounded-xl text-sm font-semibold text-white bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-500 hover:to-cyan-400 shadow-lg shadow-cyan-500/25 transition duration-150">
                    Enviar Link de Redefinição
                </button>
            </div>
        </form>

        <div class="text-center pt-2 border-t border-gray-800">
            <a href="{% url 'login' %}" class="text-xs text-cyan-400 hover:text-cyan-300 font-semibold underline">
                &larr; Voltar para o login
            </a>
        </div>
    </div>
</div>
{% endblock %}
