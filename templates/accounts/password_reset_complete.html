{% extends 'base.html' %}

{% block title %}Senha Alterada | CodeView{% endblock %}

{% block content %}
<div class="flex-1 flex items-center justify-center px-4 py-12 sm:px-6 lg:px-8">
    <div class="w-full max-w-md space-y-6 bg-[#111827]/90 border border-gray-800 rounded-2xl p-8 shadow-2xl text-center">
        <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-emerald-600/10 border border-emerald-500/30 text-emerald-400 mb-2">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
            </svg>
        </div>
        <h2 class="text-2xl font-bold tracking-tight text-white">Senha alterada com sucesso!</h2>
        <p class="text-sm text-gray-400 leading-relaxed">
            Sua nova senha foi gravada com segurança. Agora você já pode entrar na sua conta.
        </p>
        <div class="pt-4 border-t border-gray-800">
            <a href="{% url 'login' %}" class="inline-block py-2.5 px-6 rounded-xl text-xs font-semibold text-white bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-500 hover:to-cyan-400 transition">
                Entrar com a Nova Senha
            </a>
        </div>
    </div>
</div>
{% endblock %}
