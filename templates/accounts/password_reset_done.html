{% extends 'base.html' %}

{% block title %}E-mail Enviado | CodeView{% endblock %}

{% block content %}
<div class="flex-1 flex items-center justify-center px-4 py-12 sm:px-6 lg:px-8">
    <div class="w-full max-w-md space-y-6 bg-[#111827]/90 border border-gray-800 rounded-2xl p-8 shadow-2xl text-center">
        <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-emerald-600/10 border border-emerald-500/30 text-emerald-400 mb-2">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
            </svg>
        </div>
        <h2 class="text-2xl font-bold tracking-tight text-white">Verifique sua caixa de entrada</h2>
        <p class="text-sm text-gray-400 leading-relaxed">
            Se o e-mail informado estiver registrado em nossa plataforma, enviamos as instruções e o link seguro para redefinir sua senha.
        </p>
        <div class="pt-4 border-t border-gray-800">
            <a href="{% url 'login' %}" class="inline-block py-2.5 px-6 rounded-xl text-xs font-semibold text-white bg-gray-800 hover:bg-gray-700 transition">
                Voltar para o Login
            </a>
        </div>
    </div>
</div>
{% endblock %}
