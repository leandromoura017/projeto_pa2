{% extends 'base.html' %}

{% block title %}Excluir Desafio | CodeView{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto px-4 py-12 w-full">

    <div class="bg-[#111827] border border-gray-800 rounded-3xl p-6 sm:p-8 text-center shadow-2xl space-y-5">
        <div class="w-14 h-14 rounded-2xl bg-red-950/60 border border-red-800 text-red-400 flex items-center justify-center mx-auto">
            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
        </div>

        <div>
            <h1 class="text-xl font-bold text-white">
                Excluir Desafio Prático?
            </h1>
            <p class="text-xs sm:text-sm text-gray-400 mt-2 leading-relaxed">
                Você está prestes a excluir o desafio <strong class="text-white">"{{ challenge.title }}"</strong> da aula <strong>{{ lesson.title }}</strong>.
            </p>
        </div>

        <form method="POST" class="pt-3 flex flex-col sm:flex-row items-center justify-center gap-3">
            {% csrf_token %}
            <a href="{% url 'challenge_manage' course.slug lesson.id %}" class="w-full sm:w-auto px-5 py-2.5 rounded-xl bg-gray-800 hover:bg-gray-700 text-gray-300 text-xs font-semibold text-center transition">
                Cancelar
            </a>
            <button type="submit" class="w-full sm:w-auto px-6 py-2.5 rounded-xl bg-red-600 hover:bg-red-500 text-white text-xs font-bold shadow-lg shadow-red-600/30 transition">
                Confirmar e Excluir Desafio
            </button>
        </form>
    </div>

</div>
{% endblock %}
